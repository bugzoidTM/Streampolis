# Site do Streampolis. Só arquivos estáticos: a API e o game server entram pelo
# Traefik em /api e /ws, então este nginx não faz proxy de nada.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeçalhos de segurança do SITE (SPECs §37). Diferentes dos da API: aqui
  # existe uma página de verdade, que carrega bundle, fontes e texturas.
  #
  # `always` em todos: sem isso o nginx omite o header nas respostas de erro,
  # que são justamente as páginas onde um ataque tem mais chance de aparecer.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # O jogo é WebGL + WebSocket na mesma origem, e o bundle é servido daqui.
  # `frame-ancestors 'self'` impede que o jogo seja embutido em outro site —
  # é o que evita a tela de login do Streampolis aparecer dentro de uma página
  # que não é nossa.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss: https:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # O bundle tem hash no nome: pode ser guardado para sempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O HTML nunca: é ele que aponta para o bundle novo depois de um deploy.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # SPA: qualquer rota desconhecida devolve o index e o cliente resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
