# Site do Streampolis. Só arquivos estáticos: a API e o game server entram pelo
# Traefik em /api e /ws, então este nginx não faz proxy de nada.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # O bundle tem hash no nome: pode ser guardado para sempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # O HTML nunca: é ele que aponta para o bundle novo depois de um deploy.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # SPA: qualquer rota desconhecida devolve o index e o cliente resolve.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
