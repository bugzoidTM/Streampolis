# Optional overlay: docker stack deploy -c stack.yml -c stack.scaling.yml streampolis
# Each worker remains replicas: 1. Scale by adding a named worker + fixed route,
# never by load-balancing a worker's room WebSocket path across replicas.
version: "3.7"

services:
  sp-game:
    environment:
      REDIS_URL: redis://sp-redis:6379/0
      GAME_SERVER_DISTRIBUTED: "1"
      GAME_SERVER_PUBLIC_ADDRESS: streampolis.nutef.com/ws/1
      GAME_SERVER_ID: sp-game-1
    networks: [Nutef, sp-game-private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    deploy:
      labels:
        - traefik.enable=false

  sp-game-2:
    image: node:22-bookworm-slim
    working_dir: /app/packages/game-server
    command: node dist/game-server/src/index.js
    volumes:
      - /root/streampolis:/app:ro
    environment:
      NODE_ENV: development
      GAME_SERVER_HOST: 0.0.0.0
      GAME_SERVER_PORT: "2567"
      AUTH_JWT_SECRET: ${SP_JWT_SECRET}
      API_BASE_URL: http://sp-api:8787
      API_SERVICE_TOKEN: ${SP_SERVICE_TOKEN}
      REDIS_URL: redis://sp-redis:6379/0
      GAME_SERVER_DISTRIBUTED: "1"
      GAME_SERVER_PUBLIC_ADDRESS: streampolis.nutef.com/ws/2
      GAME_SERVER_ID: sp-game-2
    networks: [Nutef, sp-game-private]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2567/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=false

  sp-game-gateway:
    image: nginx:alpine
    volumes:
      - /root/streampolis/deploy/game-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [Nutef, sp-game-private]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      labels:
        - traefik.enable=true
        - traefik.docker.network=Nutef
        - traefik.http.routers.streampolis-ws.rule=Host(`streampolis.nutef.com`) && PathPrefix(`/ws`)
        - traefik.http.routers.streampolis-ws.entrypoints=websecure
        - traefik.http.routers.streampolis-ws.priority=20
        - traefik.http.routers.streampolis-ws.tls=true
        - traefik.http.routers.streampolis-ws.tls.certresolver=letsencryptresolver
        - traefik.http.routers.streampolis-ws.middlewares=streampolis-ws-strip
        - traefik.http.middlewares.streampolis-ws-strip.stripprefix.prefixes=/ws
        - traefik.http.routers.streampolis-ws.service=streampolis-ws
        - traefik.http.services.streampolis-ws.loadbalancer.server.port=8080

  sp-redis:
    # Redis 8.2.3 image exercised by the isolated two-process smoke on this VPS.
    image: redis@sha256:5c7c0445ed86918cb9efb96d95a6bfc03ed2059fe2c5f02b4d74f477ffe47915
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    # Only this stack's workers/gateway can reach Redis; no Nutef/public ports.
    networks: [sp-game-private]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          memory: 192M

networks:
  sp-game-private:
    driver: overlay
    internal: true
