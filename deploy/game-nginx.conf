# Traefik removes /ws. Fixed worker paths route sockets to their room owner;
# only matchmaking may be balanced between processes.
map $http_upgrade $game_connection {
  default upgrade;
  '' close;
}

upstream streampolis_matchmaking {
  least_conn;
  server sp-game:2567;
  server sp-game-2:2567;
}

server {
  listen 8080;
  server_name _;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $game_connection;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_buffering off;

  location = /gateway-health { return 200 'ok'; }
  location /1/ { proxy_pass http://sp-game:2567/; }
  location /2/ { proxy_pass http://sp-game-2:2567/; }
  location / {
    proxy_pass http://streampolis_matchmaking;
    # Do not replay POST seat reservations after a response was lost.
    proxy_next_upstream error timeout http_502 http_503;
  }
}
